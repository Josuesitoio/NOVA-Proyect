# Nombre del microservicio
spring.application.name=Proyecto-NOVA
# puerto de ejecución
server.port=9090
# El archivo .sqlite se creará automáticamente en la raíz de tu proyecto
spring.datasource.url=jdbc:sqlite:nova_database.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC

# 'update' genera o actualiza la tabla según tu clase KeplerDataEntity
spring.jpa.hibernate.ddl-auto=update

# Configuración visual para la consola (útil en desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto oficial para SQLite (Compatible con Spring Boot 3+)
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Ruta donde guardaremos el modelo entrenado (lo usaremos en OnnxConfig.java)
nova.ai.model-path=classpath:models/NOVA.onnx

# Permitir subida de archivos grandes (CSV de Kepler)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB